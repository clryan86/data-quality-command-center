[project]
name = "data-quality-command-center"
version = "1.0.0"
description = "Data profiling, validation rules, anomaly detection, quality scoring, and audit history"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["F"]
